<!DOCTYPE html>
<html>
<head>
  <style>
    .solid {
      border: 3px solid red;
      padding: 10px;
      margin: 5px;
    }
    .dotted {
      border: 3px dotted blue;
      padding: 10px;
      margin: 5px;
    }
    .dashed {
      border: 3px dashed green;
      padding: 10px;
      margin: 5px;
    }
    .double {
      border: 5px double purple;
      padding: 10px;
      margin: 5px;
    }
    .groove {
      border: 5px groove orange;
      padding: 10px;
      margin: 5px;
    }
    .ridge {
      border: 5px ridge brown;
      padding: 10px;
      margin: 5px;
    }
    .inset {
      border: 5px inset teal;
      padding: 10px;
      margin: 5px;
    }
    .outset {
      border: 5px outset pink;
      padding: 10px;
      margin: 5px;
    }
    .none {
      border: none;
      padding: 10px;
      margin: 5px;
    }
  </style>
</head>
<body>
  <div class="solid">Solid Border</div>
  <div class="dotted">Dotted Border</div>
  <div class="dashed">Dashed Border</div>
  <div class="double">Double Border</div>
  <div class="groove">Groove Border</div>
  <div class="ridge">Ridge Border</div>
  <div class="inset">Inset Border</div>
  <div class="outset">Outset Border</div>
  <div class="none">No Border</div>
</body>
</html>
