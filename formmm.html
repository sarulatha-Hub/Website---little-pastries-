<html>
<title>simple Form</title>
<style>
  body {
    background-color: lightblue;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  h1 {
    color: darkblue;
  }
  form {
      width: 600px;
      height: 500px;
      border: 2px solid darkblue;
      background-color: beige;
      border-radius: 15px;
      padding: 20px;
      margin: 100px auto; 
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
  h2 {
      text-align: center;
      color: darkblue;
  }
  button {
      background-color: green;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    button:hover {
      background-color: darkgreen;
    }
</style>
</head>
<body>
   <form>
       
        
      <h2>Registration Form</h2>
      <br><br><br>

    <div><label for="fullname">Full Name:</label>
    <input type="text" id="fullname" placeholder="yourname" pattern= "[a-zA-Z\s]+" title = "only letters" required><br><br>

    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br><br>

    <label for="dob">DOB:</label>
    <input type="date" id="dob" name="dob"><br><br>

  

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="example@gmail.com" required><br><br>

    <label for="phone">Password:</label>
    <input type="password" id="password" placeholder="password"><br><br>
  

    <label>Language Known:</label>
    <input type="checkbox" id="english" name="language" value="english">
    <label for="english">English</label>
    <input type="checkbox" id="hindi" name="language" value="hindi">
    <label for="hindi">Hindi</label>
    <input type="checkbox" id="tamil" name="language" value="tamil">
    <label for="tamil">Tamil</label><br><br>

   <label for="Location">Location:</label>
   <select name="Location" id="Location">
       <option value="Madurai">Madurai</option>
       <option value="chennai">chennai</option>
       <option value="coimbatore">coimbatore</option>
   </select>
   <br><br>

   <input type = "submit" value ="submit">
</form>
    
  </body>
  </head>
</html>
