<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>
</head>
<body>

<script>
    // Random number between 1 and 10
    const secnum = Math.floor(Math.random() * 10) + 1;

    // User input
    const usernum = prompt("Enter a number between 1 and 10:");

    // Convert string to number
    const guess = Number(usernum);

    if (guess === secnum) {
        alert("🎉 Correct! You guessed the right number");
    } else {
        alert("❌ Wrong! Random number was " + secnum);
    }
</script>

</body>
</html>
