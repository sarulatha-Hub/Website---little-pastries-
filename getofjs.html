<!DOCTYPE html>
<html>
<head>
  <title>Get User Input</title>
</head>
<body>
  <h1>Get Input Example</h1>
  <button onclick="getName()">Click to Enter Name</button>
  <p id="output"></p>

  <script>
    function getName() {
      // Ask user for input
      let userInput = prompt("Please enter your name:");

      // If Cancel is pressed, userInput will be null
      if (userInput == null) {
        document.getElementById("output").innerText = "You not entered any name.";
      } else {
        document.getElementById("output").innerText = "Hello, " + userInput + "!";
      }
    }
  </script>
</body>
</html>
