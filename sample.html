<!DOCTYPE html>
<html>
<head>
  <title>Simple Form</title>
  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    form {
      width: 350px;
      border: 2px solid darkblue;
      background-color: beige;
      border-radius: 15px;
      padding: 20px;
      margin: 100px auto; /* center vertically and horizontally */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      color: darkblue;
    }

    label {
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: green;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    button:hover {
      background-color: darkgreen;
    }
  </style>
</head>

<body>
  <form>
    <h2>Registration Form</h2>

    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" placeholder="Your name" required>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br><br>

    <label for="dob">DOB:</label>
    <input type="date" id="dob" name="dob">

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="example@gmail.com" required>

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Password">

    <label>Languages Known:</label><br>
    <input type="checkbox" id="english" name="language" value="english">
    <label for="english">English</label>
    <input type="checkbox" id="hindi" name="language" value="hindi">
    <label for="hindi">Hindi</label>
    <input type="checkbox" id="tamil" name="language" value="tamil">
    <label for="tamil">Tamil</label><br><br>

    <label for="Location">Location:</label>
    <select name="Location" id="Location">
      <option value="Madurai">Madurai</option>
      <option value="Chennai">Chennai</option>
      <option value="Coimbatore">Coimbatore</option>
    </select><br><br>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
